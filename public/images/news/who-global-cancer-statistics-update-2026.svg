  <ellipse cx="280" cy="195" rx="65" ry="22" fill="none" stroke="#e0e0e0" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="280" cy="195" rx="22" ry="65" fill="none" stroke="#e0e0e0" stroke-width="0.8" opacity="0.35"/>
  <!-- 支架 -->
  <path d="M280 260 Q280 270 275 285" stroke="#c49a6c" stroke-width="5" fill="none"/>
  <rect x="255" y="285" width="40" height="8" fill="#c49a6c" rx="2"/>
  <rect x="265" y="291" width="20" height="25" fill="#d4a574" rx="3"/>
  <!-- 統計圖表 -->
  <rect x="420" y="140" width="260" height="150" fill="#fff" rx="6" filter="url(#sh8)"/>
  <rect x="435" y="155" width="230" height="120" fill="#fafaf8" rx="3"/>
  <text x="550" y="175" text-anchor="middle" fill="#2d6a4f" font-size="11" font-weight="700" font-family="sans-serif">GLOBAL CANCER INCIDENCE 2025</text>
  <!-- 條形圖 -->
  <rect x="455" y="195" width="50" height="60" fill="#40916c" rx="3"/>
  <text x="480" y="268" text-anchor="middle" fill="#666" font-size="7" font-family="sans-serif">Lung</text>
  <rect x="515" y="205" width="50" height="50" fill="#52b788" rx="3"/>
  <text x="540" y="268" text-anchor="middle" fill="#666" font-size="7" font-family="sans-serif">Breast</text>
  <rect x="575" y="210" width="50" height="45" fill="#81c784" rx="3"/>
  <text x="600" y="268" text-anchor="middle" fill="#666" font-size="7" font-family="sans-serif">CRC</text>
  <rect x="635" y="215" width="50" height="40" fill="#a5d6a7" rx="3"/>
  <text x="660" y="268" text-anchor="middle" fill="#666" font-size="7" font-family="sans-serif">Liver</text>
  <!-- 世界地圖輪廓小圖 -->
  <g transform="translate(130 280)" opacity="0.08">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#2d6a4f"/>
