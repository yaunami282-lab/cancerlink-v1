<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="sh8" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2c3e50" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f5ef"/>
      <stop offset="100%" stop-color="#e8ddcc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg10)"/>
  <rect x="420" y="0" width="200" height="400" fill="#fff8e1" opacity="0.15"/>
  <!-- 桌面 -->
  <rect x="60" y="320" width="680" height="80" fill="#dcd1be" rx="6" filter="url(#sh8)"/>
  <!-- 地球儀 -->
  <circle cx="280" cy="195" r="65" fill="#bbdefb" filter="url(#sh8)"/>
  <circle cx="280" cy="195" r="65" fill="none" stroke="#c49a6c" stroke-width="5"/>
  <!-- 大陸 -->
  <ellipse cx="265" cy="180" rx="22" ry="18" fill="#a5d6a7" opacity="0.6"/>
  <ellipse cx="300" cy="175" rx="15" ry="20" fill="#81c784" opacity="0.55"/>
  <ellipse cx="290" cy="210" rx="18" ry="12" fill="#a5d6a7" opacity="0.5"/>
  <ellipse cx="255" cy="210" rx="12" ry="14" fill="#66bb6a" opacity="0.45"/>
  <ellipse cx="310" cy="200" rx="10" ry="7" fill="#c8e6c9" opacity="0.5"/>
