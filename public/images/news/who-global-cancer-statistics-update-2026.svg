<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a7d5a"/>
      <stop offset="50%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- 世界地圖輪廓 -->
  <g transform="translate(750, 180)" opacity="0.1">
    <!-- 簡化世界地圖路徑 -->
    <ellipse cx="0" cy="100" rx="200" ry="120" fill="white"/>
    <ellipse cx="-60" cy="20" rx="80" ry="60" fill="white"/>
    <ellipse cx="80" cy="40" rx="65" ry="55" fill="white"/>
    <ellipse cx="20" cy="80" rx="50" ry="40" fill="white"/>
    <ellipse cx="-20" cy="150" rx="45" ry="35" fill="white"/>
    <ellipse cx="150" cy="120" rx="40" ry="30" fill="white"/>
  </g>

  <!-- 統計圖表 -->
  <g transform="translate(150, 380)" opacity="0.15">
    <!-- 條形圖 -->
    <rect x="0" y="0" width="40" height="80" rx="4" fill="white"/>
    <rect x="55" y="15" width="40" height="65" rx="4" fill="white"/>
    <rect x="110" y="30" width="40" height="50" rx="4" fill="white"/>
    <rect x="165" y="10" width="40" height="70" rx="4" fill="white"/>
    <rect x="220" y="25" width="40" height="55" rx="4" fill="white"/>
    <!-- X軸 -->
    <line x1="-20" y1="85" x2="280" y2="85" stroke="white" stroke-width="3"/>
    <!-- Y軸 -->
    <line x1="-20" y1="-10" x2="-20" y2="85" stroke="white" stroke-width="3"/>
    <!-- 趨勢線 -->
    <polyline points="20,70 75,50 130,65 185,45 240,55" fill="none" stroke="#52b788" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="70" r="6" fill="#52b788"/>
    <circle cx="75" cy="50" r="6" fill="#52b788"/>
    <circle cx="130" cy="65" r="6" fill="#52b788"/>
    <circle cx="185" cy="45" r="6" fill="#52b788"/>
    <circle cx="240" cy="55" r="6" fill="#52b788"/>
  </g>

  <!-- 數字 21.5M -->
  <g transform="translate(160, 200)" opacity="0.1">
    <text font-family="Inter, sans-serif" font-size="100" font-weight="900" fill="white">21.5M</text>
  </g>

  <!-- 文字區 -->
  <g transform="translate(80, 120)">
    <text x="0" y="0" font-family="Noto Sans TC, sans-serif" font-size="48" font-weight="800" fill="white">2026 全球癌症統計更新</text>
    <text x="0" y="60" font-family="Noto Sans TC, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.85)">世衛組織：亞洲早期篩查覆蓋率仍待提升</text>
    <rect x="0" y="90" width="60" height="4" rx="2" fill="#52b788"/>
    <text x="0" y="135" font-family="Noto Sans TC, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">權威數據 · Cancer Link 癌研連線</text>
  </g>
</svg>
