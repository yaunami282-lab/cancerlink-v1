<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="50%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- 離心管 / 液體活檢 -->
  <g transform="translate(850, 280)" opacity="0.12">
    <!-- 試管架 -->
    <rect x="-80" y="20" width="160" height="12" rx="3" fill="white"/>
    <rect x="-60" y="30" width="120" height="6" rx="2" fill="white" opacity="0.5"/>
    <!-- 試管 -->
    <rect x="-50" y="-80" width="20" height="100" rx="6" fill="none" stroke="white" stroke-width="3"/>
    <rect x="-45" y="-50" width="10" height="40" rx="3" fill="white" opacity="0.4"/>
    <rect x="-12" y="-70" width="20" height="90" rx="6" fill="none" stroke="white" stroke-width="3"/>
    <rect x="-7" y="-40" width="10" height="35" rx="3" fill="white" opacity="0.4"/>
    <rect x="26" y="-85" width="20" height="105" rx="6" fill="none" stroke="white" stroke-width="3"/>
    <rect x="31" y="-55" width="10" height="45" rx="3" fill="white" opacity="0.4"/>
  </g>

  <!-- DNA 甲基化圖案 -->
  <g transform="translate(200, 280)" opacity="0.1">
    <path d="M-100 -100 Q-80 -80 -100 -60 Q-80 -40 -100 -20 Q-80 0 -100 20 Q-80 40 -100 60 Q-80 80 -100 100" stroke="white" stroke-width="5" fill="none"/>
    <path d="M100 -100 Q80 -80 100 -60 Q80 -40 100 -20 Q80 0 100 20 Q80 40 100 60 Q80 80 100 100" stroke="white" stroke-width="5" fill="none"/>
    <!-- CH3 甲基標記 -->
    <circle cx="-80" cy="-80" r="10" fill="#f0c040" opacity="0.6"/>
    <circle cx="-80" cy="0" r="10" fill="#f0c040" opacity="0.6"/>
    <circle cx="-80" cy="80" r="10" fill="#f0c040" opacity="0.6"/>
    <circle cx="80" cy="-40" r="10" fill="#f0c040" opacity="0.6"/>
    <circle cx="80" cy="40" r="10" fill="#f0c040" opacity="0.6"/>
  </g>

  <!-- 放大鏡/檢測圖示 -->
  <g transform="translate(550, 200)" opacity="0.1">
    <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-width="4"/>
    <path d="M42 42 L80 80" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="20" fill="white"/>
  </g>

  <!-- 數字 78% -->
  <g transform="translate(120, 160)" opacity="0.08">
    <text font-family="Inter, sans-serif" font-size="120" font-weight="900" fill="white">78%</text>
  </g>

  <!-- 文字區 -->
  <g transform="translate(80, 120)">
    <text x="0" y="0" font-family="Noto Sans TC, sans-serif" font-size="44" font-weight="800" fill="white">液體活檢重大突破</text>
    <text x="0" y="55" font-family="Noto Sans TC, sans-serif" font-size="28" font-weight="500" fill="rgba(255,255,255,0.85)">一次抽血 · 同時篩查 12 種癌症 · 靈敏度 78%</text>
    <rect x="0" y="85" width="60" height="4" rx="2" fill="#52b788"/>
    <text x="0" y="130" font-family="Noto Sans TC, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">篩查指南 · Cancer Link 癌研連線</text>
  </g>
</svg>
