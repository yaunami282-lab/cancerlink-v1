  <!-- 毛毯 -->
  <path d="M130 280 Q250 265 370 275" stroke="#bbdefb" stroke-width="16" fill="none" opacity="0.35" stroke-linecap="round"/>
  <!-- 茶几 -->
  <rect x="500" y="310" width="250" height="12" fill="#d4a574" rx="4" filter="url(#sh7)"/>
  <rect x="520" y="322" width="8" height="78" fill="#c49a6c" rx="2"/>
  <rect x="722" y="322" width="8" height="78" fill="#c49a6c" rx="2"/>
  <!-- 茶壺 -->
  <ellipse cx="620" cy="295" rx="28" ry="16" fill="#d4a574" filter="url(#sh7)"/>
