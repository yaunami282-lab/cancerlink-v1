<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2c3e50" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#ece3d5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg3)"/>
  <rect x="420" y="0" width="200" height="400" fill="#fff3e0" opacity="0.18"/>
  <!-- 靜脈輸液架 -->
  <rect x="480" y="50" width="6" height="280" fill="#c0c0c0" rx="3" filter="url(#sh)"/>
  <rect x="460" y="50" width="46" height="10" fill="#c0c0c0" rx="3"/>
  <!-- 輸液袋 -->
  <rect x="440" y="65" width="60" height="80" fill="#e8f5e9" rx="8" filter="url(#sh)"/>
  <rect x="442" y="67" width="56" height="76" fill="#f1f8f2" rx="6"/>
  <rect x="445" y="70" width="50" height="12" fill="#c8e6c9" rx="3"/>
  <line x1="470" y1="145" x2="470" y2="185" stroke="#ddd" stroke-width="2"/>
  <!-- 窗外景色 -->
  <rect x="120" y="80" width="240" height="200" fill="#e3f2fd" rx="10"/>
  <rect x="120" y="80" width="240" height="200" fill="none" stroke="#d4a574" stroke-width="8" rx="10"/>
  <rect x="235" y="80" width="8" height="200" fill="#d4a574"/>
  <rect x="120" y="175" width="240" height="8" fill="#d4a574"/>
  <!-- 窗外樹 -->
  <ellipse cx="180" cy="140" rx="35" ry="20" fill="#a5d6a7" opacity="0.6"/>
  <ellipse cx="300" cy="160" rx="30" ry="18" fill="#81c784" opacity="0.5"/>
  <!-- 窗外陽光 -->
  <circle cx="320" cy="100" r="25" fill="#fff9c4" opacity="0.4"/>
  <!-- 窗台 -->
  <rect x="110" y="280" width="260" height="12" fill="#e8d5b7" rx="3"/>
  <!-- 盆栽 -->
  <rect x="300" y="262" width="26" height="20" fill="#c49a6c" rx="3"/>
  <circle cx="313" cy="256" r="14" fill="#81c784"/>
  <circle cx="308" cy="250" r="9" fill="#a5d6a7"/>
  <circle cx="318" cy="252" r="8" fill="#66bb6a"/>
  <!-- 桌面 -->
  <rect x="350" y="310" width="400" height="90" fill="#e0d6c5" rx="6" filter="url(#sh)"/>
  <!-- 前景書本 -->
  <rect x="370" y="290" width="100" height="24" fill="#d4a574" rx="3" transform="rotate(-5 420 302)"/>
  <rect x="374" y="293" width="92" height="18" fill="#fefefe" rx="2" transform="rotate(-5 420 302)"/>
</svg>
