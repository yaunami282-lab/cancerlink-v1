<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <filter id="sh9" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2c3e50" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf7f1"/>
      <stop offset="100%" stop-color="#efe4d3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg11)"/>
  <!-- 晨光 -->
  <rect x="450" y="0" width="200" height="400" fill="#fff3e0" opacity="0.2"/>
  <!-- 窗簾 -->
  <path d="M440 0 Q470 100 450 200 Q480 300 440 400" fill="#fce4ec" opacity="0.25"/>
  <path d="M452 0 Q482 100 462 200 Q492 300 452 400" fill="#f8bbd0" opacity="0.18"/>
  <!-- 床頭櫃 -->
  <rect x="280" y="275" width="160" height="125" fill="#d4a574" rx="8" filter="url(#sh9)"/>
  <rect x="275" y="270" width="170" height="10" fill="#c49a6c" rx="3"/>
  <!-- 藥盒與水杯 -->
  <rect x="300" y="230" width="50" height="36" fill="#fff" rx="6" filter="url(#sh9)"/>
  <rect x="305" y="235" width="18" height="14" fill="#e8f5e9" rx="2"/>
  <rect x="327" y="235" width="18" height="14" fill="#fff3e0" rx="2"/>
  <circle cx="314" cy="242" r="2" fill="#66bb6a" opacity="0.5"/>
  <circle cx="336" cy="242" r="2" fill="#ffb74d" opacity="0.5"/>
  <!-- 水杯 -->
  <rect x="370" y="230" width="28" height="40" fill="#fff" rx="6" filter="url(#sh9)"/>
  <rect x="373" y="233" width="22" height="34" fill="#f8fafc" rx="4"/>
  <ellipse cx="384" cy="252" rx="10" ry="4" fill="#e3f2fd" opacity="0.35"/>
  <!-- 小夜燈 -->
  <ellipse cx="430" cy="220" rx="28" ry="25" fill="#fff3e0" filter="url(#sh9)"/>
  <ellipse cx="430" cy="220" rx="20" ry="18" fill="#ffe0b2"/>
  <ellipse cx="430" cy="220" rx="10" ry="9" fill="#ffcc80"/>
  <rect x="426" y="243" width="8" height="30" fill="#c49a6c" rx="3"/>
  <!-- 床上布料 -->
  <path d="M60 360 Q200 330 400 345 Q580 355 740 365 L740 400 L60 400 Z" fill="#f5ebe0" opacity="0.5"/>
  <path d="M80 365 Q220 340 410 352 Q570 362 720 370 L720 400 L80 400 Z" fill="#fdf5eb" opacity="0.4"/>
  <!-- WHO止痛階梯卡片 -->
  <rect x="100" y="140" width="150" height="110" fill="#fff" rx="6" filter="url(#sh9)" transform="rotate(-1 175 195)"/>
  <rect x="105" y="145" width="140" height="100" fill="#fefefe" rx="4" transform="rotate(-1 175 195)"/>
  <text x="175" y="162" text-anchor="middle" fill="#2d6a4f" font-size="9" font-weight="700" font-family="sans-serif" transform="rotate(-1 175 195)">WHO Analgesic Ladder</text>
  <!-- 三階梯 -->
  <rect x="120" y="175" width="110" height="18" fill="#a5d6a7" rx="2" transform="rotate(-1 175 195)"/>
  <text x="175" y="187" text-anchor="middle" fill="#2d6a4f" font-size="7" font-family="sans-serif" transform="rotate(-1 175 195)">Step 1: Non-opioid</text>
  <rect x="120" y="198" width="110" height="18" fill="#66bb6a" rx="2" transform="rotate(-1 175 195)"/>
  <text x="175" y="210" text-anchor="middle" fill="#fff" font-size="7" font-family="sans-serif" transform="rotate(-1 175 195)">Step 2: Weak opioid</text>
  <rect x="120" y="221" width="110" height="18" fill="#40916c" rx="2" transform="rotate(-1 175 195)"/>
  <text x="175" y="233" text-anchor="middle" fill="#fff" font-size="7" font-family="sans-serif" transform="rotate(-1 175 195)">Step 3: Strong opioid</text>
  <!-- 前景虛化 -->
  <ellipse cx="680" cy="340" rx="55" ry="30" fill="#ffe0b2" opacity="0.06"/>
</svg>
