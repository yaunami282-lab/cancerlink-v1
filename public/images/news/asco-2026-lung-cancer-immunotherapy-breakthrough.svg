<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#52b788" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- 肺/呼吸圖示 -->
  <g transform="translate(850, 315)" opacity="0.15">
    <ellipse cx="-60" cy="0" rx="55" ry="90" fill="white" transform="rotate(-10)"/>
    <ellipse cx="60" cy="0" rx="55" ry="90" fill="white" transform="rotate(10)"/>
    <ellipse cx="-60" cy="0" rx="30" ry="50" fill="white" transform="rotate(-10)"/>
    <ellipse cx="60" cy="0" rx="30" ry="50" fill="white" transform="rotate(10)"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="white" stroke-width="4"/>
  </g>

  <!-- DNA 雙螺旋裝飾 -->
  <g transform="translate(150, 315)" opacity="0.12">
    <path d="M-80 -120 Q-60 -100 -80 -80 Q-60 -60 -80 -40 Q-60 -20 -80 0 Q-60 20 -80 40 Q-60 60 -80 80 Q-60 100 -80 120" stroke="white" stroke-width="6" fill="none"/>
    <path d="M80 -120 Q60 -100 80 -80 Q60 -60 80 -40 Q60 -20 80 0 Q60 20 80 40 Q60 60 80 80 Q60 100 80 120" stroke="white" stroke-width="6" fill="none"/>
    <line x1="-68" y1="-100" x2="68" y2="-100" stroke="white" stroke-width="2"/>
    <line x1="-72" y1="-60" x2="72" y2="-60" stroke="white" stroke-width="2"/>
    <line x1="-68" y1="-20" x2="68" y2="-20" stroke="white" stroke-width="2"/>
    <line x1="-72" y1="20" x2="72" y2="20" stroke="white" stroke-width="2"/>
    <line x1="-68" y1="60" x2="68" y2="60" stroke="white" stroke-width="2"/>
    <line x1="-72" y1="100" x2="72" y2="100" stroke="white" stroke-width="2"/>
  </g>

  <!-- 免疫細胞（T細胞）圖示 -->
  <g transform="translate(500, 280)" opacity="0.18">
    <circle cx="0" cy="0" r="60" fill="white"/>
    <circle cx="-25" cy="-15" r="12" fill="#1b4332"/>
    <circle cx="25" cy="-15" r="12" fill="#1b4332"/>
    <circle cx="25" cy="15" r="14" fill="#1b4332"/>
    <circle cx="0" cy="25" r="14" fill="#1b4332"/>
    <circle cx="-25" cy="15" r="14" fill="#1b4332"/>
  </g>

  <!-- 文字區 -->
  <g transform="translate(80, 160)">
    <text x="0" y="0" font-family="Noto Sans TC, sans-serif" font-size="52" font-weight="800" fill="white">ASCO 2026 年度突破</text>
    <text x="0" y="65" font-family="Noto Sans TC, sans-serif" font-size="36" font-weight="500" fill="rgba(255,255,255,0.85)">雙免疫聯合方案 · 晚期肺癌五年生存率</text>
    <rect x="0" y="95" width="60" height="4" rx="2" fill="#52b788"/>
    <text x="0" y="140" font-family="Noto Sans TC, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">免疫前沿 · Cancer Link 癌研連線</text>
  </g>

  <!-- 裝飾圓點 -->
  <circle cx="1100" cy="80" r="4" fill="white" opacity="0.3"/>
  <circle cx="1120" cy="100" r="6" fill="white" opacity="0.2"/>
  <circle cx="1080" cy="120" r="3" fill="white" opacity="0.25"/>
</svg>
